name: Staging to Production Pipeline

on:
  push:
    branches:
      - staging

jobs:
  production-checks:
    name: Production Grade Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Backend Static Analysis & Build Check
        run: |
          cd church-backend
          go vet ./...
          go build -v ./cmd/server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Web Type-Check & Build Check
        run: |
          cd web
          npm run build

  promote-to-main:
    name: Promote Staging to Main
    needs: production-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward / Merge Staging into Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge origin/staging --ff-only || git merge origin/staging -m "ci: promote staging to main"
          git push origin main
