services:
  db:
    image: postgres:16-alpine
    container_name: heritage_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-hof_church}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hof_church}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - heritage_net

  backend:
    build:
      context: ./church-backend
      dockerfile: Dockerfile
    container_name: heritage_prod_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-hof_church}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-myHertage-superapp-production-secret-key-change-in-prod}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/callback/google}
    expose:
      - "8080"
    networks:
      - heritage_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: heritage_prod_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - heritage_net

volumes:
  pgdata_prod:

networks:
  heritage_net:
    driver: bridge
